onditioned space\u003cbr />\u003cbr />Everything was designed so that you have the practicality of a home with the comfort of premium accommodation.\u003cbr />\u003cbr />🏢 The building\u003cbr />The building is new, modern and has incredible infrastructure to make your experience even more special.\u003cbr />🌴 Pool with a panoramic view of Ipanema Beach\u003cbr />🏋️ Complete gym with a simply surreal view of the sea\u003cbr />🛗 Modern and safe structure\u003cbr />✨ Elegant, newly renovated shared common spaces\u003cbr />Imagine starting the day by working out with a view of one of the most famous beaches in the world or relaxing by the pool admiring the blue ocean. 🌊☀️\u003cbr />\u003cbr />📍 The location\u003cbr />\u003cbr />You will be in the heart of Ipanema, surrounded by the best that Rio has to offer.\u003cbr />🚶‍♂️ Easy access to Ipanema Beach\u003cbr />🌅 Near the famous Arpoador sunset\u003cbr />☕ Charming cafes\u003cbr />🍹 Renowned bars and restaurants\u003cbr />🛍️ Shops, markets and pharmacies\u003cbr />🚇 Easy access to the subway and the city's main tourist landmarks\u003cbr />🌴 The experience\u003cbr />\u003cbr />More than a place to stay, this is an invitation to experience the true Rio lifestyle. Stroll along the waterfront, enjoy the beach kiosks, discover the flavors of Ipanema, and return to a cozy, modern space with an unforgettable view.\u003cbr />💙 Whether it's to rest, explore the city or work with an inspiring view, this apartment has been prepared for you to enjoy the best of Rio de Janeiro with all the comfort you deserve.\u003cbr />☀️🌊 Ipanema awaits you! 🌊☀️","localizedString":"Newly renovated apartment in Ipanema, located in a completely renovated building, combining comfort, functionality and contemporary design. Every detail has been planned to provide a practical and welcoming stay, with custom-made furniture, elegant decor, and well-utilized spaces. Ideal for those who want to experience Rio in style, steps from the beach, excellent restaurants, cafes, bars and the best that Ipanema has to offer.\u003cbr />\u003cbr />\u003cb>The space\u003c/b>\u003cbr />🌊✨ Welcome to your hideaway in Ipanema! ✨🌊\u003cbr />Stay in one of the most iconic neighborhoods in Rio de Janeiro and enjoy an experience that combines comfort, convenience, and a breathtaking view. 🏖️☀️\u003cbr />\u003cbr />🏡 The apartment\u003cbr />Newly assembled and carefully planned, the apartment offers everything you need for a comfortable stay, whether for a vacation, remote work, or a longer stay.\u003cbr />\u003cbr />You will find:\u003cbr />🛏️ Quality bed and bath linens\u003cbr />🛋️ Comfortable sofa bed\u003cbr />🌅 Private balcony overlooking the ocean\u003cbr />🍳 Complete and equipped kitchen\u003cbr />☕ Coffee maker\u003cbr />🍟 Airfryer\u003cbr />🍽️ Utensils, pots, dishes, glasses and cutlery\u003cbr />👕 Iron\u003cbr />💇‍♀️ Hair dryer\u003cbr />✨ Flat iron\u003cbr />📶 High-speed Wi-Fi\u003cbr />❄️ Air-conditioned space\u003cbr />\u003cbr />Everything was designed so that you have the practicality of a home with the comfort of premium accommodation.\u003cbr />\u003cbr />🏢 The building\u003cbr />The building is new, modern and has incredible infrastructure to make your experience even more special.\u003cbr />🌴 Pool with a panoramic view of Ipanema Beach\u003cbr />🏋️ Complete gym with a simply surreal view of the sea\u003cbr />🛗 Modern and safe structure\u003cbr />✨ Elegant, newly renovated shared common spaces\u003cbr />Imagine starting the day by working out with a view of one of the most famous beaches in the world or relaxing by the pool admiring the blue ocean. 🌊☀️\u003cbr />\u003cbr />📍 The location\u003cbr />\u003cbr />You will be in the heart of Ipanema, surrounded by the best that Rio has to offer.\u003cbr />🚶‍♂️ Easy access to Ipanema Beach\u003cbr />🌅 Near the famous Arpoador sunset\u003cbr />☕ Charming cafes\u003cbr />🍹 Renowned bars and restaurants\u003cbr />🛍️ Shops, markets and pharmacies\u003cbr />🚇 Easy access to the subway and the city's main tourist landmarks\u003cbr />🌴 The experience\u003cbr />\u003cbr />More than a place to stay, this is an invitation to experience the true Rio lifestyle. Stroll along the waterfront, enjoy the beach kiosks, discover the flavors of Ipanema, and return to a cozy, modern space with an unforgettable view.\u003cbr />💙 Whether it's to rest, explore the city or work with an inspiring view, this apartment has been prepared for you to enjoy the best of Rio de Janeiro with all the comfort you deserve.\u003cbr />☀️🌊 Ipanema awaits you! 🌊☀️","source":"Apartamento recém-reformado em Ipanema, localizado em prédio totalmente renovado, combinando conforto, funcionalidade e design contemporâneo. Cada detalhe foi planejado para proporcionar uma estadia prática e acolhedora, com móveis sob medida, decoração elegante e ambientes bem aproveitados. Ideal para quem deseja viver a experiência carioca com estilo, a poucos passos da praia, de excelentes restaurantes, cafés, bares e do melhor que Ipanema tem a oferecer.\u003cbr />\u003cbr />\u003cb>The space\u003c/b>\u003cbr />🌊✨ Bem-vindo ao seu refúgio em Ipanema! ✨🌊\u003cbr />Hospede-se em um dos bairros mais icônicos do Rio de Janeiro e viva uma experiência que combina conforto, praticidade e uma vista de tirar o fôlego. 🏖️☀️\u003cbr />\u003cbr />🏡 O apartamento\u003cbr />Recém-montado e cuidadosamente planejado, o apartamento oferece tudo o que você precisa para uma estadia confortável, seja para férias, trabalho remoto ou uma temporada mais longa.\u003cbr />\u003cbr />Você encontrará:\u003cbr />🛏️ Roupa de cama e banho de qualidade\u003cbr />🛋️ Sofá-cama confortável\u003cbr />🌅 Varanda privativa com vista para o mar\u003cbr />🍳 Cozinha completa e equipada\u003cbr />☕ Cafeteira\u003cbr />🍟 Airfryer\u003cbr />🍽️ Utensílios, panelas, pratos, copos e talheres\u003cbr />👕 Ferro de passar roupa\u003cbr />💇‍♀️ Secador de cabelo\u003cbr />✨ Chapinha\u003cbr />📶 Wi-Fi de alta velocidade\u003cbr />❄️ Ambiente climatizado\u003cbr />\u003cbr />Tudo foi pensado para que você tenha a praticidade de um lar com o conforto de uma hospedagem premium.\u003cbr />\u003cbr />🏢 O prédio\u003cbr />O edifício é novo, moderno e conta com uma infraestrutura incrível para tornar sua experiência ainda mais especial.\u003cbr />🌴 Piscina com vista panorâmica para a Praia de Ipanema\u003cbr />🏋️ Academia completa com uma vista simplesmente surreal para o mar\u003cbr />🛗 Estrutura moderna e segura\u003cbr />✨ Áreas comuns elegantes e recém-reformadas\u003cbr />Imagine começar o dia treinando com vista para uma das praias mais famosas do mundo ou relaxar na piscina admirando o azul do oceano. 🌊☀️\u003cbr />\u003cbr />📍 A localização\u003cbr />\u003cbr />Você estará no coração de Ipanema, cercado pelo melhor que o Rio tem a oferecer.\u003cbr />🚶‍♂️ Fácil acesso à Praia de Ipanema\u003cbr />🌅 Próximo ao famoso pôr do sol do Arpoador\u003cbr />☕ Cafeterias charmosas\u003cbr />🍹 Bares e restaurantes renomados\u003cbr />🛍️ Lojas, mercados e farmácias\u003cbr />🚇 Fácil acesso ao metrô e aos principais pontos turísticos da cidade\u003cbr />🌴 A experiência\u003cbr />\u003cbr />Mais do que uma hospedagem, este é um convite para viver o verdadeiro estilo de vida carioca. Caminhe pela orla, aproveite os quiosques da praia, descubra os sabores de Ipanema e retorne para um espaço acolhedor, moderno e com uma vista inesquecível.\u003cbr />💙 Seja para descansar, explorar a cidade ou trabalhar com uma vista inspiradora, este apartamento foi preparado para que você aproveite o melhor do Rio de Janeiro com todo o conforto que merece.\u003cbr />☀️🌊 Ipanema espera por você! 🌊☀️"},"modalTitle":"About this space","shortDescriptionHtml":{"__typename":"PdpUGCText","content":{"__typename":"UGCText","localizedStringWithTranslationPreference":"Newly renovated apartment in Ipanema, located in a completely renovated building, combining comfort, functionality and contemporary design. Every detail has been planned to provide a practical
